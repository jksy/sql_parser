# https://docs.codecov.com/docs/codecov-yaml
codecov:
  require_ci_to_pass: true

coverage:
  # Report only; the branch ruleset requires the ci-passed job, not codecov.
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags"
  behavior: default
  require_changes: false

# unit: test:unit (grammar + AST, every PR)
# adapter: test:adapter (Oracle connection tests; carried forward when the
#          Oracle job does not run)
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit
    - name: adapter

# Note: the parsers generated from .treetop files are not committed, and
# Codecov drops files that do not exist in the repository, so the numbers on
# Codecov cover the hand-written code only. The local SimpleCov HTML report
# (rake test:unit without CI=1) includes the generated parsers as a separate
# group.

ignore:
  - test/**
