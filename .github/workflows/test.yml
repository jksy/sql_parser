name: test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Regenerate parsers from treetop grammars
        run: bundle exec rake gen_force

      # The generated parsers are committed; fail if a .treetop (or the
      # reserved word generator) changed without regenerating them.
      - name: Check that the committed parsers are up to date
        run: git diff --exit-code -- lib/oracle-sql-parser/grammar

      - name: Run parser tests
        run: bundle exec rake test:unit
        env:
          CI: "1"

      # Coverage is uploaded from one Ruby version only to avoid duplicate reports.
      # Authenticates with GitHub OIDC (public repository), so no upload token is needed.
      - name: Upload coverage to Codecov
        if: matrix.ruby == '3.4'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/coverage.xml
          flags: unit
          use_oidc: true
          fail_ci_if_error: true

  # Single job to require in the branch ruleset, so the matrix can change
  # without touching the ruleset.
  ci-passed:
    name: ci-passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every test job succeeded
        run: test "${{ needs.test.result }}" = "success"
