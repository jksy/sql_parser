name: actionlint

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actionlint.yaml
      - .github/tools/actionlint/**

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image, pinned by digest in the Dockerfile.
      - name: Build actionlint image
        run: docker build --quiet --tag actionlint .github/tools/actionlint
      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo actionlint -version
          docker run --rm -v "$PWD:/repo" -w /repo actionlint -color
