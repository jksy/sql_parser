name: Secret scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Check out the PR head rather than the merge commit, so the scanned
      # range is exactly the commits the PR adds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The official image, pinned by digest in the Dockerfile.
      - name: Build gitleaks image
        run: docker build --quiet --tag gitleaks .github/tools/gitleaks
      - name: Scan the PR commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo gitleaks version
          docker run --rm -v "$PWD:/repo" -w /repo gitleaks git --log-opts="origin/$BASE_REF..HEAD" --redact --verbose .
